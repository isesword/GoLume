name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Preserve existing check names for required-check compatibility,
          # independently of the pinned runner image labels.
          - check_name: validate (ubuntu-latest)
            os: ubuntu-24.04
            goos: linux
            arch: amd64
          # Standard ARM64 runners support private repositories. This is native
          # execution, separate from the cross-compilation phase below.
          - check_name: validate (ubuntu-24.04-arm, arm64)
            os: ubuntu-24.04-arm
            goos: linux
            arch: arm64
          - check_name: validate (macos-latest)
            os: macos-15
            goos: darwin
            arch: arm64
    env:
      VALIDATE_EXPECT_ARCH: ${{ matrix.arch }}
      VALIDATE_EXPECT_OS: ${{ matrix.goos }}
      VALIDATE_REQUIRE_NATIVE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Ensure structural-check tools
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update; sudo apt-get install --no-install-recommends -y ripgrep ;;
              macOS) brew install ripgrep ;;
              *) echo "Unsupported runner: $RUNNER_OS" >&2; exit 1 ;;
            esac
          fi

      - name: Structural checks and vet
        run: bash scripts/validate.sh checks

      - name: Scalar and SIMD tests
        run: bash scripts/validate.sh tests

      - name: Native SIMD widths and CPU fallback
        run: bash scripts/validate.sh runtime

      - name: Scalar and SIMD race tests
        run: bash scripts/validate.sh race

      - name: Cross-compile linux/amd64 and linux/arm64
        run: bash scripts/validate.sh cross

      - name: Lazy execution demo
        run: bash scripts/validate.sh demo
